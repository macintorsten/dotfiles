# Bootstrap project: `mise bootstrap --from <url>` runs this file.
# Global tools live in home/.config/mise/config.toml (deployed to ~/.config/mise).

min_version = "2026.10.4"

[settings]
dotfiles.root = "."

# home/ mirrors $HOME; every file in it is symlinked into place.
[dotfile_groups.home]
root = "home"

[bootstrap.packages]
# Build dependencies for lua, vim for EDITOR/.vimrc, imagemagick for `tv`.
"apt:build-essential" = "latest"
"apt:libreadline-dev" = "latest"
"apt:vim" = "latest"
"apt:imagemagick" = "latest"

[bootstrap.repos]
"~/.tmux/plugins/tpm" = { url = "https://github.com/tmux-plugins/tpm.git" }
"~/.local/share/vim-plug" = { url = "https://github.com/junegunn/vim-plug.git" }

[dotfiles]
"~/.vim/autoload/plug.vim" = "~/.local/share/vim-plug/plug.vim"

# mise lives in ~/.local/bin, which must be on PATH before the shims block calls it.
# Interactive shells inherit PATH from the login shell.
"~/.bash_profile/local-bin" = { line = 'export PATH="$HOME/.local/bin:$PATH"', position = "prepend" }
# A ~/.bash_profile hides ~/.profile, so load that (Ubuntu's sources ~/.bashrc) or fall back to ~/.bashrc.
"~/.bash_profile/profile" = { line = 'if [ -f "$HOME/.profile" ]; then . "$HOME/.profile"; elif [ -f "$HOME/.bashrc" ]; then . "$HOME/.bashrc"; fi' }
"~/.bashrc/bashrc-d" = { line = 'for f in "$HOME/.config/bashrc.d"/*.sh; do [ -r "$f" ] && . "$f"; done; unset f' }

# Shims in ~/.bash_profile, full activation in ~/.bashrc.
[bootstrap.mise_shell_activate]
bash = true

# Plugin installs need the tools from [tools], so run after they exist. Idempotent.
[bootstrap.hooks.post-tools]
run = [
  "mise exec -- ~/.tmux/plugins/tpm/bin/install_plugins",
  "mise exec -- nvim --headless '+Lazy! restore' +qa",
]

[tasks.test]
description = "Bootstrap this repo's committed HEAD in a clean Ubuntu container, twice, and verify"
run = '''
docker run --rm -it -e MISE_GITHUB_TOKEN -v "{{ config_root }}:/src:ro" ubuntu:latest bash -c '
  set -e
  apt-get update -qq && apt-get install -y -qq curl git ca-certificates >/dev/null
  git config --global --add safe.directory "*"
  curl -fsSL https://mise.run | sh
  export PATH="$HOME/.local/bin:$PATH"
  mise bootstrap --from /src --yes
  mise bootstrap --from /src --yes
  cd ~/.local/share/mise/bootstrap-repo
  mise bootstrap status --missing
  mise dot status | grep -c applied
  cd
  bash -lc "command -v rg"
  bash -ic "command -v rg && echo EDITOR=\$EDITOR"
  exec bash -l
'
'''
